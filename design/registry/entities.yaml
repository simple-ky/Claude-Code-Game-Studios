# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: path_length_px
    status: active
    source: design/gdd/lane-map-system.md
    referenced_by:
      - design/gdd/lane-map-system.md      # D.4 — definition
      # Wave & Spawn (#18) will divide this by zombie move_speed_px_per_sec
      # to produce per-lane travel time. Append it to referenced_by when the
      # Wave & Spawn GDD is authored.
    variables:
      - lane_depth_cells       # int, typical 30 at MVP; scene-authoring-time
      - cell_size_px           # locked constant (see constants section)
      - bend_depth_fraction    # locked constant (see constants section)
      - bend_angle_deg         # locked range 20–30 (see constants section)
    output_range: [1920, 2400]   # px, MVP defaults at lane_depth_cells=30:
                                 # straight=1920, max bend ~+8.8% ≈ 2089;
                                 # range allows for V1 lane_depth_cells up to ~37
    expression: |
      segment_pre_bend  = bend_depth_fraction × lane_depth_cells × cell_size_px
      lateral_offset_px = segment_pre_bend × tan(bend_angle_deg × π / 180)
      segment_post_bend = sqrt((lane_depth_cells × (1 − bend_depth_fraction) × cell_size_px)² + lateral_offset_px²)
      path_length_px    = segment_pre_bend + segment_post_bend
    notes: >
      Spawn-to-goal centreline distance. Each lane has one bend at
      `bend_depth_fraction` lane depth at a `bend_angle_deg` inflection.
      Always greater than a straight `lane_depth_cells × cell_size_px`.
      At 20° bend, post-bend is ~1.6% longer than straight equivalent;
      at 30° bend, ~7%. Wave/Spawn divides by zombie move_speed_px_per_sec
      to compute travel time in seconds. Lane/Map GDD Section D.4.
    added: 2026-05-02
    revised: ""

  - name: buildable_strip_distribution
    status: active
    source: design/gdd/lane-map-system.md
    referenced_by:
      - design/gdd/lane-map-system.md      # D.5 — definition
      # Placement & Grid (#25) will read cell counts; append when authored.
    variables:
      - total_buildable_cells              # int, 18 at MVP (see constants)
      - lane_count                         # int, 2 at MVP, 2–3 at V1
      - lane_width_cells                   # int, 5 at MVP (see constants)
    output_range: [1, 3]                   # strip_rows_needed; hard cap at 3
    expression: |
      cells_per_lane     = total_buildable_cells / lane_count
      strip_rows_needed  = ceil(cells_per_lane / lane_width_cells)
    notes: >
      Derives strip row count from cell budget and lane configuration.
      Hard constraint: strip_rows_needed ≤ 3 (Section C Rule 6). At MVP
      defaults: cells_per_lane = 9, strip_rows_needed = ceil(9/5) = 2.
      If strip_rows_needed > 3, the cell budget exceeds the strip-depth
      constraint and must be reduced before scene authoring. Lane/Map
      GDD Section D.5.
    added: 2026-05-02
    revised: ""

  - name: cursor_world_pos_transform
    status: active
    source: design/gdd/input-system.md
    referenced_by:
      - design/gdd/input-system.md           # D.1 — definition, Rule 5
      - design/gdd/lane-map-system.md        # consumes world_pos via Placement & Grid pass-through (line 229)
      # Placement & Grid (#25) and Wall/Fortification (#27) GDDs will be
      # appended when authored — they are the direct consumers of cursor_world_pos.
    variables:
      - mouse_screen_pos      # Vector2, viewport-relative, [0, viewport_size_px]
      - canvas_transform      # Transform2D, from get_viewport().get_canvas_transform()
    output_range: ["-inf", "+inf"]    # componentwise; unbounded by formula; bounded by Camera2D limits in practice
    expression: |
      canvas_transform = get_viewport().get_canvas_transform()
      mouse_screen_pos = get_viewport().get_mouse_position()
      cursor_world_pos = canvas_transform.affine_inverse() * mouse_screen_pos
    notes: >
      Screen-to-world cursor transform for InputBus.cursor_world_pos. Uses
      Viewport-level canvas transform (NOT Camera2D node's transform) to
      correctly incorporate Camera2D zoom AND to remain null-safe during
      RUN_LOADING before a Camera2D is added to the scene. Evaluated once
      per InputBus._process frame. Consumers (Placement & Grid #25,
      Wall/Fortification #27, Lane/Map #7 mutation API) are responsible
      for clamping to their valid regions. Input GDD Section D.1.
    added: 2026-05-16
    revised: ""


# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: cell_size_px
    status: active
    source: design/gdd/lane-map-system.md
    referenced_by:
      - design/gdd/lane-map-system.md
      - design/gdd/camera-system.md    # D.2 (lane corridor check), D.4 (WAVE_PREP offset), D.5 (safety margin cell count)
      # Pipeline-binding. Will be referenced by every per-asset spec in
      # design/art/asset-specs/, plus Placement & Grid (#25), Wave/Spawn
      # (#18) for sprite-scale, HUD GDD when authored.
    value: 96
    unit: pixels
    notes: >
      Pipeline-binding: every sprite is sized against this value. Do NOT
      change after MVP art begins. Locked at 96 by Lane/Map GDD R2 DD#4
      (2026-05-02); previous value was 64 (changed for readability at
      target zoom and Steam Deck viewport). Camera GDD Section D uses 96
      throughout (D.2: 2×5×96=960px corridor; D.4: 2×96=192px WAVE_PREP
      offset; D.5: 533px ÷ 96 ≈ 5.6 cells safety margin).
    added: 2026-05-02
    revised: "2026-05-16"  # 64 → 96, per Lane/Map R2 DD#4; registry was stale

  - name: lane_count_mvp
    status: active
    source: design/gdd/lane-map-system.md
    referenced_by:
      - design/gdd/lane-map-system.md
      # Wave/Spawn (#18) per-lane spawner loop, Placement & Grid (#25)
      # cell affinity, Camera (#6) view bounds, Crowd Pathfinding (#11)
      # path-requery count.
    value: 2
    unit: lanes
    notes: >
      MVP scope: 1 map, 2 lanes parallel (NOT V-shape). V1 expands to
      3 maps under the same data structure with up to 3 lanes per map
      (see lane_count_v1_max). Locked by Lane/Map GDD Section C Rule 4.
    added: 2026-05-02
    revised: ""

  - name: lane_count_v1_max
    status: active
    source: design/gdd/lane-map-system.md
    referenced_by:
      - design/gdd/lane-map-system.md
    value: 3
    unit: lanes
    notes: >
      V1 ceiling. >3 lanes fails Pillar 4 readability and scales
      t_navpoly_rebake unacceptably. Locked by Lane/Map GDD Section C
      Rule 1 and Tuning Knobs.
    added: 2026-05-02
    revised: ""

  - name: lane_width_cells_mvp
    status: active
    source: design/gdd/lane-map-system.md
    referenced_by:
      - design/gdd/lane-map-system.md
      # Wave/Spawn (#18) parallel-zombie-file count, Placement & Grid
      # (#25) cell column count.
    value: 5
    unit: cells
    notes: >
      Paper-prototype-gated (see Lane/Map Open Question #4). 3 cells:
      zombies single-file always, chokepoint loses meaning. 7+ cells:
      silhouette illegible at 100+ density (Pillar 2 fails). Locked at
      5 pending paper-prototype validation.
    added: 2026-05-02
    revised: ""

  - name: lane_depth_cells_mvp
    status: active
    source: design/gdd/lane-map-system.md
    referenced_by:
      - design/gdd/lane-map-system.md
      # Wave/Spawn (#18) divides D.4 path_length_px by zombie speed
      # for travel time; Camera (#6) vertical bounds.
    value: 30
    unit: cells
    notes: >
      MVP target. <25 cells: zombies arrive too fast, Pillar 4
      reaction-time fails. >40 cells: wave pacing drags. Lane/Map GDD
      Tuning Knobs.
    added: 2026-05-02
    revised: ""

  - name: bend_depth_fraction
    status: active
    source: design/gdd/lane-map-system.md
    referenced_by:
      - design/gdd/lane-map-system.md
      # Wave/Spawn (#18) — chokepoint timing within travel time.
    value: 0.60
    unit: fraction_of_lane_depth
    notes: >
      Position of the mid-lane bend along its depth. Safe range
      0.50–0.70. Must not overlap buildable_strip_position_fraction.
      Locked by Lane/Map GDD Section C Rule 5.
    added: 2026-05-02
    revised: ""

  - name: bend_angle_deg_min
    status: active
    source: design/gdd/lane-map-system.md
    referenced_by:
      - design/gdd/lane-map-system.md
    value: 20
    unit: degrees
    notes: >
      Lower bound of the mid-lane bend inflection angle. Below 20°
      the Rule 5 chokepoint disappears. Locked by Lane/Map GDD
      Section C Rule 5 and Tuning Knobs.
    added: 2026-05-02
    revised: ""

  - name: bend_angle_deg_max
    status: active
    source: design/gdd/lane-map-system.md
    referenced_by:
      - design/gdd/lane-map-system.md
    value: 30
    unit: degrees
    notes: >
      Upper bound of the mid-lane bend inflection angle. Above 35°
      the NavigationPolygon outline becomes irregular and the lane
      stops reading as a single corridor. Locked by Lane/Map GDD
      Section C Rule 5 and Tuning Knobs.
    added: 2026-05-02
    revised: ""

  - name: total_buildable_cells_mvp
    status: active
    source: design/gdd/lane-map-system.md
    referenced_by:
      - design/gdd/lane-map-system.md
      # Placement & Grid (#25) cell budget, Resource/Economy (#20)
      # placement-cost-per-cell calculations.
    value: 18
    unit: cells
    notes: >
      Paper-prototype-gated (see Lane/Map Open Question #4). Total
      buildable cells across all MVP lanes. <12: no placement
      experimentation, Pillar 3 fails. >24: strip stops feeling like
      a strip, Section B fantasy breaks. Lane/Map GDD Section C Rule 6
      and Tuning Knobs.
    added: 2026-05-02
    revised: ""

  - name: buildable_strip_position_fraction
    status: active
    source: design/gdd/lane-map-system.md
    referenced_by:
      - design/gdd/lane-map-system.md
    value: 0.20
    unit: fraction_of_lane_depth_from_goal
    notes: >
      Distance the buildable strip sits from the goal end of the lane.
      Safe range 0.15–0.25. <0.15: too close to goal, no defensive
      depth. >0.25: strip eats into bend area. Must not overlap
      bend_depth_fraction. Locked by Lane/Map GDD Tuning Knobs.
    added: 2026-05-02
    revised: ""

  - name: bake_total_budget_ms
    status: active
    source: design/gdd/lane-map-system.md
    referenced_by:
      - design/gdd/lane-map-system.md           # D.6 budget + Section E AC-LM-21
      - docs/architecture/adr-0001-run-state-game-flow.md  # bake gate
      - docs/architecture/adr-0002-crowd-pathfinding-architecture.md
      # Run State (#8) raises 500ms timeout-and-abort to MAIN_MENU;
      # ADR-0001 needs amendment to capture this (Open Question #2).
    value: 500
    unit: milliseconds
    notes: >
      Total RUN_LOADING ceiling for all-lanes initial bake. Exceeding
      this aborts the run to MAIN_MENU with an error. Per-lane bake
      budget is 5–15 ms one-shot (see ADR-0002). Pending real-Steam-Deck
      benchmark (Open Question #7) before this number is locked
      against shipping hardware.
    added: 2026-05-02
    revised: ""

  - name: rebake_per_mutation_slack_ms
    status: active
    source: design/gdd/lane-map-system.md
    referenced_by:
      - design/gdd/lane-map-system.md           # D.7 — definition
      # Wall/Fortification (#27) mid-wave placement budget; perf-watchlist.
    value: 5
    unit: milliseconds
    notes: >
      Conservative frame-budget slack reserved for the mid-wave re-bake
      cycle (t_navpoly_rebake + t_map_changed_propagation + t_path_requery)
      after CrowdManager + engine overhead. Hard constraint: if
      t_navpoly_rebake > 3 ms in profiling, mid-wave placement must
      throttle, move to a thread, or be disabled. Lane/Map GDD D.7.
    added: 2026-05-02
    revised: ""

  - name: input_menu_initial_delay_ms
    status: active
    source: design/gdd/input-system.md
    referenced_by:
      - design/gdd/input-system.md           # D.2 + Section G — definition
      # Settings (#42) and Accessibility (#43) will surface as player slider
      # at VS/Alpha respectively; append when authored.
    value: 300
    unit: milliseconds
    notes: >
      Delay before the first synthetic repeat fires after holding a
      menu-navigation action key (action_ui_navigate_*). Safe range
      [200, 500]; below 200 risks accidental repeats on quick taps,
      above 500 feels sluggish. Designer-owned at MVP; Accessibility #43
      may expose as a player slider at Alpha (Q7 in Input GDD Open
      Questions). Constraint: initial_delay_ms >= repeat_interval_ms.
      Input GDD Section D.2 and Section G.
    added: 2026-05-16
    revised: ""

  - name: input_menu_repeat_interval_ms
    status: active
    source: design/gdd/input-system.md
    referenced_by:
      - design/gdd/input-system.md           # D.2 + Section G — definition
      # Settings (#42) and Accessibility (#43) will surface as player slider
      # at VS/Alpha respectively; append when authored.
    value: 100
    unit: milliseconds
    notes: >
      Interval between subsequent synthetic repeat events after the
      initial delay, while a menu-navigation action key is held. Safe
      range [80, 200]; below 80 the player cannot read list items as
      they scroll past, above 200 fast-scroll feels slow. Designer-owned
      at MVP; Accessibility #43 may expose as a player slider at Alpha.
      Constraint: input_menu_repeat_interval_ms <= input_menu_initial_delay_ms.
      Input GDD Section D.2 and Section G.
    added: 2026-05-16
    revised: ""

  - name: gamepad_deadzone_inner
    status: active
    source: design/gdd/input-system.md
    referenced_by:
      - design/gdd/input-system.md           # D.3 + Section G — definition
      # Settings (#42) will surface as a player slider at VS;
      # Accessibility (#43) may lift safe-range ceiling to 0.30 at Alpha.
      # Player Controller (#14) consumes get_movement_vector() output.
    value: 0.15
    unit: unitless_fraction
    notes: >
      Inner radius of the analog stick deadzone. Raw stick magnitudes
      below this value are treated as zero; above this value, magnitudes
      are renormalized to [0.0, 1.0] via the D.3 stick_deadzone_normalization
      formula. Matches SDL3 default in Godot 4.5+. Safe range [0.05, 0.20]
      at MVP/VS; Accessibility #43 may bump ceiling to 0.30 at Alpha for
      severe hardware drift accommodation (Q5 in Input GDD Open Questions).
      Player-configurable via Settings #42 when authored. Encoded directly
      via Input.get_vector(...)'s deadzone parameter in Godot 4.x.
      Input GDD Section D.3 and Section G.
    added: 2026-05-16
    revised: ""

  - name: cam_shake_max_amplitude_px
    status: active
    source: design/gdd/camera-system.md
    referenced_by:
      - design/gdd/camera-system.md          # D.7 (trauma accumulation), D.9 (shake offset) — definition; G.1, G.4; H AC-CAM-09/-11/-17/-18
      # Juice / Feedback Pipeline (#9) authors per-event amplitudes in
      # JuiceProfile.tres that must not exceed this cap. Append when authored.
    value: 12
    unit: pixels
    notes: >
      Maximum shake displacement applied to Camera2D.offset in world-space
      pixels. Also serves as the normalization denominator in the trauma
      accumulation formula (D.7): each event's amplitude_px is divided by
      this value to compute its trauma increment, ensuring trauma stays
      in [0, 1]. Per-event amplitudes authored in JuiceProfile.tres by
      Juice/Feedback Pipeline (#9) must stay at or below this value.
      Default MVP values: kill=3px (0.25 trauma), crit=5px (0.417 trauma),
      boss kill=8px (0.667 trauma). Reduce Motion accessibility halving
      applies to the per-event amplitudes in JuiceProfile, not to this cap.
      Camera GDD Section D.7, D.9, and Section G.
    added: 2026-05-16
    revised: ""

  - name: cam_follow_speed
    status: active
    source: design/gdd/camera-system.md
    referenced_by:
      - design/gdd/camera-system.md          # C.Rule 4, D.3, G.1; H AC-CAM-03
      # Settings (#42) will surface as player slider at VS milestone per
      # Camera GDD Open Question #2; append when authored.
      # Player Controller (#14) will care about feel-coupling between
      # movement input responsiveness and camera follow latency; append
      # when authored.
    value: 10.0
    unit: per_second
    notes: >
      `Camera2D.position_smoothing_speed` coefficient. Controls the
      Y-axis follow latency on the Champion. Half-life formula per D.3:
      `cam_tracking_half_life_s = ln(2) / cam_follow_speed`. At default
      10.0, half-life ≈ 69 ms (formula) / ~63 ms (Godot's discrete
      Euler integration). Safe range [0.1, 100.0]; below 2.0 the camera
      drags noticeably; above 30.0 it snaps on every micro-input. Player-
      tunable candidate at VS via Settings #42 (Camera GDD Open Q #2).
      Camera GDD Section C Rule 4, D.3, G.1.
    added: 2026-05-23
    revised: ""

  - name: reduce_motion_amplitude_multiplier
    status: active
    source: design/gdd/camera-system.md
    referenced_by:
      - design/gdd/camera-system.md          # C Rule 7 parenthetical, G.1 row
      # Juice / Feedback Pipeline (#9) applies this multiplier to per-event
      # amplitude_px BEFORE calling Camera.shake(). Append when authored.
      # Accessibility (#43) owns the UI toggle that flips between the
      # discrete values; append when authored at Alpha.
    value: 0.5
    unit: multiplier
    notes: >
      Discrete-set multiplier {0.0, 0.5, 1.0}: 1.0 = Reduce Motion OFF
      (default), 0.5 = Reduce Motion ON (default-when-on), 0.0 = shake
      fully disabled (player-toggled accessibility option only — must
      NOT be silently forced). Applied by Juice #9 to per-event
      amplitude_px before the call to Camera.shake(); Camera sees the
      smaller amplitude and treats it normally — Camera itself does NOT
      apply this multiplier. Default value listed here (0.5) reflects
      the default-when-Reduce-Motion-is-on choice; the cross-system
      consensus on this default is owned by Accessibility #43 at Alpha
      (Camera GDD Open Q #3). Camera GDD Section C Rule 7, G.1.
    added: 2026-05-23
    revised: ""
