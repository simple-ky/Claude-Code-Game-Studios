# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-05-02"  # Lane/Map R2 application: lane-map perf budget; aggregated LaneSystem.geometry_baked contract; cross_system_invariants section seeded; forbidden_pattern mutation_api_called_outside_wall_fortification added

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: current_state
    status: active
    owner_system: game-state-machine
    adr: docs/architecture/adr-0001-run-state-game-flow.md
    interface: "GameStateMachine.current_state (read-only int, GameState enum value 0-8). Write access only via transition_to(), pause(), resume()."
    write_access: game-state-machine-only
    referenced_by:
      - docs/architecture/adr-0001-run-state-game-flow.md
    added: 2026-04-25
    revised: ""

  - state: current_wave
    status: active
    owner_system: game-state-machine
    adr: docs/architecture/adr-0001-run-state-game-flow.md
    interface: "GameStateMachine.current_wave (read-only int; 0 if not in a run). Updated internally on transition into RUN_PREP for the next wave; published in state_snapshot_ready."
    write_access: game-state-machine-only
    referenced_by:
      - docs/architecture/adr-0001-run-state-game-flow.md
    added: 2026-04-25
    revised: ""

  - state: run_seed
    status: active
    owner_system: game-state-machine
    adr: docs/architecture/adr-0001-run-state-game-flow.md
    interface: "GameStateMachine.run_seed (read-only int). Set on run_started signal; deterministic RNG seed for the entire run. All gameplay systems requiring randomness must derive their RNG state from this seed (Test Harness, Wave composition, Card-Roll, Loot)."
    write_access: game-state-machine-only
    referenced_by:
      - docs/architecture/adr-0001-run-state-game-flow.md
    added: 2026-04-25
    revised: ""

  - state: current_champion_id
    status: active
    owner_system: game-state-machine
    adr: docs/architecture/adr-0001-run-state-game-flow.md
    interface: "GameStateMachine.current_champion_id (read-only StringName). Identifies which Champion is selected for the current run. Champion System (12) owns Champion *definitions*; GameStateMachine owns *which one is currently active*."
    write_access: game-state-machine-only
    referenced_by:
      - docs/architecture/adr-0001-run-state-game-flow.md
    added: 2026-04-25
    revised: ""

  - state: current_map_id
    status: active
    owner_system: game-state-machine
    adr: docs/architecture/adr-0001-run-state-game-flow.md
    interface: "GameStateMachine.current_map_id (read-only StringName). Identifies which Map is selected for the current run. Lane/Map System (7) owns Map *definitions*; GameStateMachine owns *which one is currently active*."
    write_access: game-state-machine-only
    referenced_by:
      - docs/architecture/adr-0001-run-state-game-flow.md
    added: 2026-04-25
    revised: ""

  - state: run_started_at
    status: active
    owner_system: game-state-machine
    adr: docs/architecture/adr-0001-run-state-game-flow.md
    interface: "GameStateMachine.run_started_at (read-only int, unix timestamp). Set on run_started; 0 if not in a run. Used for elapsed-time computation in snapshot."
    write_access: game-state-machine-only
    referenced_by:
      - docs/architecture/adr-0001-run-state-game-flow.md
    added: 2026-04-25
    revised: ""

