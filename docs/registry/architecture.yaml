# ─── CROSS-SYSTEM INVARIANTS ─────────────────────────────────────────────────
# Load-bearing invariants that span multiple systems. Each entry encodes a
# constraint that must hold across systems for the architecture to remain valid.
# /architecture-review checks these when it reviews any GDD that touches the
# named systems.
#
# Register an invariant when one system's design relies on a baseline behavior
# from another system that, if weakened, would break the dependent system's
# correctness or design intent. Examples: "X assumes Y's destructibility,"
# "A's clutch-tool design requires B's cost multiplier."
#
# Required fields: invariant, status, owners, statement, source, registered_by, added

cross_system_invariants:
  - invariant: lane_map_rule_9_requires_wall_destructibility
    status: active
    owners:
      - lane-map                # consumer; relies on the invariant
      - wall-fortification      # producer; must preserve the invariant
    statement: "Wall/Fortification (#27) walls MUST be destructible (finite HP, zombie-attackable hitbox) at all times. Lane/Map's Section C Rule 9 ('walls may freely block all paths') depends on this — without destructibility, a player can build a sealed ring and trivially win, and the no-path window has no recovery mechanism."
    source: design/gdd/lane-map-system.md       # Section F load-bearing dependency
    registered_by: lane-map-r2
    added: 2026-05-02

  - invariant: wall_fortification_mid_wave_cost_lever_required
    status: active
    owners:
      - lane-map                # design intent (Section C Rule 8)
      - wall-fortification      # owns the lever
    statement: "Wall/Fortification (#27) GDD MUST define `wall_mid_wave_cost_multiplier` with a default ≥ 1.5×. Without a non-trivial cost multiplier, mid-wave wall placement becomes the optimal strategy rather than a clutch tool, breaking Lane/Map Section C Rule 8's design intent."
    source: design/gdd/lane-map-system.md       # Section C Rule 8 + Section F bidirectional invariants
    registered_by: lane-map-r2  # promoted from R1 'referenced knob' to a real invariant per B8
    added: 2026-05-02

  - invariant: wall_fortification_mid_wave_cooldown_lever_required
    status: active
    owners:
      - lane-map                # design intent (Section C Rule 8) + frame budget (D.7)
      - wall-fortification      # owns the lever
    statement: "Wall/Fortification (#27) GDD MUST define `wall_mid_wave_cooldown_seconds` with a default ≥ 5 seconds. The cooldown enforces 'mid-wave is a clutch tool' (Lane/Map Rule 8 design intent) AND prevents mid-wave bake stutter from compounding across consecutive placements (Lane/Map D.7 frame budget under DD#2 Sync mode). Without this cooldown, the player can spam-place walls during a wave and the engine cannot maintain 60 fps."
    source: design/gdd/lane-map-system.md       # Section C Rule 8 + D.7 + Section F bidirectional invariants
    registered_by: lane-map-r2  # promoted from R1 'referenced knob' to a real invariant per B8
    added: 2026-05-02

