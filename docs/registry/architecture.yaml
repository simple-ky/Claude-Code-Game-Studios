# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: cross_language_boundary
    status: active
    pattern: signal              # C# emits, GDScript connects
    producer: csharp_hot_path_systems
    consumers:
      - gdscript_orchestration_layer
    adr: docs/architecture/adr-0003-language-routing-policy.md
    signal_signature: "C# side: [Signal] public delegate void <Name>EventHandler(<typed args>); GDScript side: signal_node.SignalName.connect(_on_signal_name)"
    reverse_direction: "GDScript→C# only via cached Callable for stateless compute (e.g., BuildModifier.compute_stats); never per-frame node lookup inside hot loops"
    constraint: "Every crossing incurs Variant marshalling overhead. C# hot-paths emitting >50 times/frame to GDScript MUST batch (see forbidden_patterns: unbatched_csharp_to_gdscript_signal_emission)."
    referenced_by:
      - docs/architecture/adr-0003-language-routing-policy.md
      - docs/architecture/adr-0002-crowd-pathfinding-architecture.md  # Register/SetTarget/Deregister direct calls + agent_reached_target/path_invalidated signals
      - docs/architecture/adr-0004-juice-pipeline-integration-model.md  # damage_dealt(HitEvent) C#→GDScript signal subscription
    added: 2026-04-25
    revised: ""

  - contract: state_changed
    status: active
    pattern: signal
    producer: game-state-machine
    consumers:
      - hud-system           # swaps HUD layout per state
      - adaptive-music       # swaps music track per state
      - tutorial-system      # shows context prompts on state_entered
      - card-roll-ui         # appears on CARD_ROLL entry
      - wave-summary-ui      # appears on WAVE_RESULTS entry
      - run-results-ui       # appears on RUN_RESULTS entry
      - main-menu            # appears on MAIN_MENU entry
      - test-harness         # asserts deterministic state sequences in headless sims
    adr: docs/architecture/adr-0001-run-state-game-flow.md
    signal_signature: "state_changed(from: int, to: int)  # GameState enum values; emitted by GameStateMachine on every transition (including pause/resume)"
    constraint: "Connect via typed Callable form ONLY: GameStateMachine.state_changed.connect(_on_state_changed). String-based connect() is forbidden by forbidden_patterns: string_based_signal_connection."
    referenced_by:
      - docs/architecture/adr-0001-run-state-game-flow.md
      - docs/architecture/adr-0002-crowd-pathfinding-architecture.md  # CrowdManager subscribes to gate _waveActive flag for per-frame velocity update
      - docs/architecture/adr-0004-juice-pipeline-integration-model.md  # Juice subscribes to abort active hit-stop on RUN_PAUSED entry
    added: 2026-04-25
    revised: ""

  - contract: state_snapshot_ready
    status: active
    pattern: signal
    producer: game-state-machine
    consumers:
      - save-load-system     # decides which snapshots persist; ADR-006 owns persistence policy
    adr: docs/architecture/adr-0001-run-state-game-flow.md
    signal_signature: "state_snapshot_ready(snapshot: Dictionary)  # JSON-serializable Dictionary with keys: schema_version, state, previous_state, current_wave, champion_id, map_id, run_seed, started_at_unix, elapsed_run_seconds"
    constraint: "Snapshot fires on EVERY state transition (including pause/resume). Save/Load (ADR-006, pending) owns the policy of which snapshots persist to disk. The Dictionary shape is locked here; schema_version bumps on key changes."
    referenced_by:
      - docs/architecture/adr-0001-run-state-game-flow.md
      - docs/architecture/adr-0006-save-schema-versioning.md  # owns the on-disk policy for this snapshot Dictionary; run_snapshot.save's top-level schema_version IS this snapshot's schema_version
    added: 2026-04-25
    revised: ""

  - contract: wave_complete_cross_language
    status: active
    pattern: signal              # C# emits, GDScript connects
    producer: wave-system        # C# hot-path per ADR-0003
    consumers:
      - game-state-machine       # GDScript autoload; transitions WAVE_ACTIVE → WAVE_RESULTS
    adr: docs/architecture/adr-0001-run-state-game-flow.md
    signal_signature: "C# side: [Signal] public delegate void WaveCompleteEventHandler(int waveNumber, WavePerformance performance); GDScript side: wave_system.wave_complete.connect(_on_wave_complete)  # snake_case auto-translation per Godot 4.6.2"
    constraint: "MUST fire EXACTLY ONCE per wave end (not per zombie spawn, not per zombie death, not per frame). Per-frame emission violates forbidden_patterns: unbatched_csharp_to_gdscript_signal_emission. GDScript-side connect() MUST use snake_case `wave_complete`, not PascalCase `WaveComplete` (see forbidden_patterns: csharp_signal_pascalcase_in_gdscript_connect)."
    referenced_by:
      - docs/architecture/adr-0001-run-state-game-flow.md
      - docs/architecture/adr-0003-language-routing-policy.md  # boundary contract precedent
    added: 2026-04-25
    revised: ""

  - contract: agent_reached_target
    status: active
    pattern: signal              # C# emits, GDScript connects
    producer: crowd-manager      # C# autoload per ADR-0002
    consumers:
      - zombie-ai                # GDScript; reacts on its own agent reaching its goal
      - damage-and-health        # may apply player-base damage when zombie reaches goal zone
    adr: docs/architecture/adr-0002-crowd-pathfinding-architecture.md
    signal_signature: "C# side: [Signal] public delegate void AgentReachedTargetEventHandler(CrowdAgent agent); GDScript side: CrowdManager.agent_reached_target.connect(_on_agent_reached_target)  # snake_case auto-translation"
    constraint: "Emitted ONCE per agent reaching its goal (not per frame, not per waypoint). Typed CrowdAgent argument requires C# assembly compiled before scene load — otherwise argument silently downgrades to CharacterBody2D. GDScript-side connect() MUST use snake_case `agent_reached_target` (PascalCase form is forbidden by csharp_signal_pascalcase_in_gdscript_connect)."
    referenced_by:
      - docs/architecture/adr-0002-crowd-pathfinding-architecture.md
    added: 2026-04-27
    revised: ""

  - contract: path_invalidated
    status: active
    pattern: signal              # C# emits, GDScript connects
    producer: crowd-manager      # C# autoload per ADR-0002
    consumers:
      - test-harness             # asserts path-invalidation correctness in headless sims
    adr: docs/architecture/adr-0002-crowd-pathfinding-architecture.md
    signal_signature: "C# side: [Signal] public delegate void PathInvalidatedEventHandler(int goalZoneId); GDScript side: CrowdManager.path_invalidated.connect(_on_path_invalidated)  # snake_case auto-translation"
    constraint: "Emitted ONCE per requery batch after a placement_changed / wall_destroyed / geometry_baked event, AFTER NavigationServer2D.map_changed has fired (ensures rebuilt navmesh, not stale path). Per-event emission is forbidden — multiple events in one frame collapse via CallDeferred."
    referenced_by:
      - docs/architecture/adr-0002-crowd-pathfinding-architecture.md
    added: 2026-04-27
    revised: ""

  - contract: damage_dealt
    status: active
    pattern: signal              # C# emits, GDScript connects
    producer: damage-system      # C# hot-path per ADR-0003
    consumers:
      - juice                    # GDScript autoload; orchestrates hit-stop, shake, particles, SFX per JuiceProfile
      - damage-number            # GDScript; pooled damage numbers (deferred to GDD #35)
      - test-harness             # asserts damage event count, IsKill correctness in headless sims
    adr: docs/architecture/adr-0004-juice-pipeline-integration-model.md
    signal_signature: "C# side: [Signal] public delegate void DamageDealtEventHandler(HitEvent hitEvent); HitEvent : RefCounted with Target/Amount/IsKill/IsCrit/IsBoss/ProfileId/ImpactPosition/ImpactDirection. GDScript side: DamageSystem.damage_dealt.connect(_on_damage_dealt)  # snake_case auto-translation"
    constraint: "Emitted ONCE per resolved damage event (not per-frame health update). ≤50 emissions/frame upper bound (per forbidden_pattern: unbatched_csharp_to_gdscript_signal_emission). If any AoE ability exceeds this, contract evolves to damage_dealt_batch(Array[HitEvent]) — single emission per frame. GDScript-side connect() MUST use snake_case `damage_dealt`, not PascalCase `DamageDealt` (csharp_signal_pascalcase_in_gdscript_connect). HitEvent property access from GDScript uses PascalCase declared names (hit_event.Amount, hit_event.IsCrit) per csharp_method_snakecase_in_gdscript_call. Runtime guard required: assert(hit_event is HitEvent, ...) catches C#-assembly-not-loaded silent downgrade."
    referenced_by:
      - docs/architecture/adr-0004-juice-pipeline-integration-model.md
    added: 2026-04-27
    revised: ""

  - contract: save_manager_api
    status: active
    pattern: method_call             # synchronous GDScript method invocations
    producer: save-manager           # GDScript autoload per ADR-0006
    consumers:
      - settings                     # writes settings.cfg via SaveManager (ConfigFile under the hood)
      - meta-progression             # writes meta_progression.save
      - meta-currency                # writes meta_currency.save
      - leaderboard                  # writes leaderboard.save
      - achievements                 # writes achievements.save
      - save-load                    # writes run_snapshot.save (consumer of ADR-0001 snapshot Dictionary)
      - test-harness                 # loads fixture saves via the SAME API as production
    adr: docs/architecture/adr-0006-save-schema-versioning.md
    signal_signature: "save_domain(domain: StringName, data: Dictionary) -> bool  AND  load_domain(domain: StringName) -> LoadResult. Domains do NOT manage atomicity, .bak rotation, FileAccess.store_* return checks, the Windows remove-before-rename step, or non-Dictionary parse-result guards — SaveManager owns all of those internally."
    constraint: "Domains MUST go through SaveManager for ALL user:// I/O. Direct FileAccess writes or reads to user:// from outside SaveManager are forbidden (see forbidden_patterns: direct_save_file_io_outside_save_manager). save_domain() returns true on full success; false on any FileAccess failure (callers should check). load_domain() never throws; callers inspect LoadResult.status."
    referenced_by:
      - docs/architecture/adr-0006-save-schema-versioning.md
    added: 2026-04-28
    revised: ""

  - contract: lane_system_geometry_baked
    status: active
    pattern: signal                  # GDScript LaneSystem autoload emits; consumers connect
    producer: lane-system            # GDScript per ADR-0003 / Lane-Map GDD
    consumers:
      - crowd-manager                # C# autoload per ADR-0002; first path query gated on this signal
      - wave-spawn                   # GDScript / C#; spawn registration gated on this signal
      - placement-grid               # GDScript; buildable cell list initialised after this signal
    adr: docs/architecture/adr-0002-crowd-pathfinding-architecture.md
    signal_signature: "geometry_baked()  # parameterless aggregate; emits ONCE after ALL lanes in the active map have completed initial bake during RUN_LOADING; emits again after EACH individual re-bake completes during WAVE_ACTIVE / WAVE_PREP. Aggregated form (per Lane/Map R2 / B5a) supersedes the R1 per-lane form. GDScript→C# auto-translation: not applicable (signal originates from GDScript side; consumers in C# subscribe via .connect())."
    constraint: "Lane/Map R2: aggregate `LaneSystem.geometry_baked` is the cross-system contract; per-lane `lane.geometry_baked` is an internal implementation detail and NOT part of the interface. Initial-bake emission is gated on EVERY lane reaching Ready (Lane/Map cross-state constraint). Bake mode: synchronous (DD#2 — main-thread blocking call) — consumers receive the signal in a deferred callback, AFTER NavigationServer2D.map_changed has fired. Pathfinding queries before this signal return empty paths (silent failure mode); see forbidden_pattern: pathfinding_query_before_geometry_baked (to be registered when CrowdManager story lands)."
    referenced_by:
      - docs/architecture/adr-0002-crowd-pathfinding-architecture.md
      - design/gdd/lane-map-system.md       # Section C Rule 2; emitter contract
    added: 2026-05-02

  - contract: save_manager_signals
    status: active
    pattern: signal                  # GDScript signals; UI subscribes
    producer: save-manager           # GDScript autoload per ADR-0006
    consumers:
      - hud                          # generic warning surfaces (save_failed)
      - meta-progression-ui          # HARD subscriber to load_fell_back_to_defaults (ADR-0006 Risk 1)
      - settings-ui                  # error dialog on load_too_old / load_too_new
      - run-results-ui               # warning if run snapshot recovered from backup
    adr: docs/architecture/adr-0006-save-schema-versioning.md
    signal_signature: "save_failed(domain: StringName, reason: String); load_recovered_from_backup(domain: StringName); load_fell_back_to_defaults(domain: StringName, preserved_path: String); load_too_old(domain: StringName, file_version: int, supported_min: int); load_too_new(domain: StringName, file_version: int)"
    constraint: "load_fell_back_to_defaults is a HARD UI contract — meta-progression UI MUST subscribe and render a non-blocking warning so players don't think they lost progress to a bug (ADR-0006 Risk 1). preserved_path is the empty string when no forensic preservation occurred. Acceptance test: simulate corrupt save, assert signal fires, assert warning UI renders."
    referenced_by:
      - docs/architecture/adr-0006-save-schema-versioning.md
    added: 2026-04-28
    revised: ""

