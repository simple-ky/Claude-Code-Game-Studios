# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: juice
    status: active
    budget_ms: 0.5
    adr: docs/architecture/adr-0004-juice-pipeline-integration-model.md
    notes: "Juice dispatch (signal handler + Dictionary profile lookup + Tween creation/teardown + camera shake update + pool slot lookup) at peak load ~10–15 hits/frame. EXCLUDES particle GPU simulation (owned by VFX system budget), SFX synthesis (owned by Audio Bus system budget), and Damage Number rendering (owned by GDD #35 budget)."
    referenced_by:
      - docs/architecture/adr-0004-juice-pipeline-integration-model.md
    added: 2026-04-27
    revised: ""

  - system: crowd-pathfinding
    status: active
    budget_ms: 2.0
    adr: docs/architecture/adr-0002-crowd-pathfinding-architecture.md
    notes: "Per-frame steady state at 100 agents during WAVE_ACTIVE: spatial hash update (~0.3ms) + velocity compute loop (~0.6ms — read waypoint, normalize, separation steering) + CharacterBody2D.MoveAndSlide × 100 (~0.8ms — C++ inside engine). EXCLUDES path queries (event-driven only on placement_changed/wall_destroyed/geometry_baked; deferred to next-frame after NavigationServer2D.map_changed; ~1ms for full requery batch — does NOT compound with same-frame velocity work). Refined post-prototype per ADR-0002 Validation Criteria. Headroom check: juice (0.5) + crowd (2.0) = 2.5ms vs 16.6ms total budget — leaves 14.1ms for remaining 41 systems."
    referenced_by:
      - docs/architecture/adr-0002-crowd-pathfinding-architecture.md
    added: 2026-04-28
    revised: ""

  - system: lane-map
    status: active
    budget_ms: 3.0
    cost_model: episodic                     # R2.1 — per Round 2 performance-analyst Concern E + creative-director synthesis: distinguishes episodic from steady-state for /architecture-review aggregation. /architecture-review MUST NOT sum episodic budgets into the steady-state total.
    steady_state_ms: 0.0                     # R2.1 — Lane/Map pays zero per frame in steady state; the budget is reserved for the bake event only
    episodic_ms: 3.0                         # R2.1 — explicit episodic budget (matches budget_ms)
    steady_state_ceiling_for_episodic_validity: 14.0  # R2.1 — per Lane/Map D.7 trigger rule: if /architecture-review aggregated steady-state budget (sum of all `steady_state_ms` from registered budgets, on Tier-2 reference hardware) exceeds 14.0 ms, lane-map mid-wave placement MUST escalate to (a) thread the bake, (b) disable mid-wave, or (c) reduce vertex budget. The 3 ms slack for the bake event is non-negotiable.
    adr: design/gdd/lane-map-system.md       # GDD-level budget; will migrate to a Lane/Map ADR if one is authored
    notes: "Per-mutation re-bake cost (D.7 hard constraint on `t_navpoly_rebake`) during WAVE_ACTIVE: incremental NavigationPolygon bake after one obstacle outline added (1–5 ms empirical, must benchmark on Steam Deck p95 per Open Question #7) + map_changed propagation (~0.05 ms) + path requery (~0.5–1.0 ms per lane × 2 lanes at MVP). EPISODIC cost — fires only on accepted wall mutation events, NOT every frame. Lane/Map R2 (DD#2 = Sync bake) accepts that the bake-frame may drop one frame below 60 fps (≤ 33.3 ms / ≥ 30 fps for one frame is the AC-LM-18 hard ceiling); cooldown lever (DD#1 — Rule 8 / wall_mid_wave_cooldown_seconds invariant) prevents stutter from compounding. Initial bake during RUN_LOADING is bounded by 500 ms ceiling (post-bake assertion + pre-bake outline-vertex pre-validation + adjacency-cost validation per Open Question #7 benchmark gate). R2.1 steady-state trigger rule: as downstream GDDs land and replace TBD line items in lane-map-system.md D.7 with measured budgets, /architecture-review aggregates the steady_state_ms fields; if the aggregate exceeds 14.0 ms, this entry's escalation rule fires. Cooldown protects against COMPOUND mid-wave stutter; the trigger rule protects against silent steady-state erosion."
    referenced_by:
      - design/gdd/lane-map-system.md       # D.7 frame budget + Section J R2/R2.1 application notes + R2.1 steady-state trigger rule
    added: 2026-05-02
    revised: 2026-05-02                      # R2.1 — added cost_model, steady_state_ms, episodic_ms, steady_state_ceiling_for_episodic_validity; clarified notes for steady-state trigger

